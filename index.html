<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رسالة من قلبي 🤍</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:"Cairo",sans-serif;
    background:#100815;
    color:white;
}

/* =========================================
   الخلفية
========================================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(180,65,125,.30),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(116,38,105,.30),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #0b0611,
            #241025 55%,
            #4c193d
        );
}

.background::after{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(
            circle,
            rgba(255,150,210,.08),
            transparent 25%
        );
    animation:backgroundMove 14s ease-in-out infinite alternate;
}

@keyframes backgroundMove{
    from{
        transform:translate(-4%,-3%) scale(1);
    }
    to{
        transform:translate(4%,3%) scale(1.12);
    }
}

/* =========================================
   النجوم
========================================= */

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    color:white;
    opacity:0;
    animation:
        starAppear 2s forwards,
        twinkle 3s infinite alternate;
}

@keyframes starAppear{
    to{
        opacity:.7;
    }
}

@keyframes twinkle{
    from{
        transform:scale(.7);
        opacity:.25;
    }
    to{
        transform:scale(1.3);
        opacity:1;
    }
}

/* =========================================
   القلوب
========================================= */

.heart{
    position:fixed;
    bottom:-70px;
    z-index:2;
    pointer-events:none;
    filter:
        drop-shadow(0 5px 8px rgba(0,0,0,.35))
        drop-shadow(0 0 12px rgba(255,80,170,.5));
    animation:floatHeart linear forwards;
}

@keyframes floatHeart{

    0%{
        opacity:0;
        transform:
            translateY(0)
            rotate(0)
            scale(.5);
    }

    10%{
        opacity:.9;
    }

    50%{
        transform:
            translateY(-55vh)
            translateX(35px)
            rotate(20deg)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translateY(-120vh)
            translateX(-50px)
            rotate(-20deg)
            scale(1.25);
    }
}

/* =========================================
   الشاشات
========================================= */

.screen{
    position:relative;
    z-index:10;
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    opacity:1;
    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

.screen.hide{
    opacity:0;
    transform:scale(1.05);
    pointer-events:none;
    position:absolute;
}

.hidden{
    display:none!important;
}

/* =========================================
   شاشة البداية
========================================= */

.intro{
    text-align:center;
    width:min(600px,92%);
    animation:introAppear 2.5s ease forwards;
}

@keyframes introAppear{

    0%{
        opacity:0;
        transform:translateY(35px) scale(.96);
    }

    60%{
        opacity:1;
    }

    100%{
        transform:translateY(0) scale(1);
    }
}

.smallHeart{
    font-size:72px;
    margin-bottom:20px;

    filter:
        drop-shadow(0 0 25px rgba(255,100,180,.65));

    animation:
        heartBreath 2s ease-in-out infinite;
}

@keyframes heartBreath{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.13);
    }
}

.intro h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(32px,7vw,58px);
    font-weight:500;
    margin-bottom:15px;
}

.intro p{
    font-size:16px;
    color:rgba(255,255,255,.7);
    line-height:2;
    margin-bottom:30px;
}

.openButton{
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    background:
        linear-gradient(
            135deg,
            rgba(255,110,170,.85),
            rgba(155,55,120,.85)
        );

    padding:15px 36px;

    border-radius:50px;

    font-family:"Cairo";
    font-size:17px;
    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 10px 40px rgba(0,0,0,.35),
        0 0 30px rgba(255,90,170,.2);

    transition:.4s;
}

.openButton:hover{
    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 15px 50px rgba(0,0,0,.45),
        0 0 40px rgba(255,90,170,.4);
}

.openButton:active{
    transform:scale(.96);
}

/* =========================================
   الكارت الرئيسي
========================================= */

.mainCard{
    width:min(780px,94%);
    max-height:92vh;

    overflow-y:auto;

    text-align:center;

    padding:35px 25px;

    border-radius:38px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.045)
        );

    border:
        1px solid rgba(255,255,255,.22);

    backdrop-filter:blur(22px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.15);

    animation:cardEnter 1.8s cubic-bezier(.16,1,.3,1);
}

@keyframes cardEnter{

    from{
        opacity:0;
        transform:
            translateY(60px)
            scale(.9);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================
   رسمة الولد والبنت
========================================= */

.couple{
    width:300px;
    height:210px;

    position:relative;

    margin:0 auto 5px;

    animation:
        coupleEnter 2s ease forwards;
}

@keyframes coupleEnter{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.8);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.person{
    position:absolute;
    bottom:0;

    width:120px;
    height:180px;
}

.boy{
    left:15px;
    animation:personFloat 3.5s ease-in-out infinite;
}

.girl{
    right:15px;
    animation:personFloat 3.5s ease-in-out infinite .3s;
}

@keyframes personFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.head{
    position:absolute;

    width:72px;
    height:72px;

    left:24px;
    top:5px;

    border-radius:50%;

    background:#efb18b;

    box-shadow:
        inset -5px -7px 0 rgba(0,0,0,.08);
}

.hair{
    position:absolute;

    width:76px;
    height:43px;

    left:-2px;
    top:-5px;

    background:#211a25;

    border-radius:
        45px 45px
        20px 20px;
}

.girl .hair{
    height:60px;
    background:#321b28;
    border-radius:45px;
}

.eye{
    position:absolute;

    top:37px;

    width:7px;
    height:7px;

    background:#241824;

    border-radius:50%;
}

.eye.left{
    left:19px;
}

.eye.right{
    right:19px;
}

.mouth{
    position:absolute;

    left:29px;
    top:53px;

    width:14px;
    height:7px;

    border-bottom:
        2px solid #9e4564;

    border-radius:50%;
}

.body{

    left:12px;
    bottom:0;

    width:96px;
    height:110px;

    border-radius:
        42px 42px
        15px 15px;

    background:#5278b7;
}

.girl .body{
    background:#e56598;
}

.arm{
    position:absolute;

    top:83px;

    width:18px;
    height:76px;

    background:#efb18b;

    border-radius:20px;
}

.boy .arm{
    right:-6px;
    transform:rotate(-38deg);
    transform-origin:top;
}

.girl .arm{
    left:-6px;
    transform:rotate(38deg);
    transform-origin:top;
}

.coupleHeart{
    position:absolute;

    left:50%;
    top:105px;

    transform:translateX(-50%);

    font-size:38px;

    z-index:20;

    animation:
        heartBreath 1.6s infinite;

    filter:
        drop-shadow(0 0 15px rgba(255,80,160,.7));

/* =========================================
   العنوان
========================================= */

.title{

    text-shadow:

.subtitle{

/* =========================================

.message{

.cursor{

    height:21px;

    margin-right:4px;

}

@keyframes blink{
    50%{

    }

/* =========================================

========================================= */

.finish{

.finish p{

/* =========================================

    animation:

}

@keyframes finalEnter{

.finalTitle{

.finalMessage{

.finalLine{

.signature{

/* =========================================

@media(max-width:600px){

    }

        font-size:16px;
    }
}

/* ==========================================
   Typewriter
========================================== */

function typeText(text,element,speed=72){

    return new Promise(resolve=>{

        let i=0;

        const cursor=
            document.createElement("span");

        cursor.className="cursor";

        element.appendChild(cursor);

        function write(){

            if(i<text.length){

                cursor.before(
                    document.createTextNode(
                        text[i]
                    )
                );

                i++;

                setTimeout(write,speed);

            }else{

                cursor.remove();

                resolve();

            }

        }

        write();

    });
}


/* ==========================================
   كتابة السطور
========================================== */

async function writeLines(
    array,
    container
){

    for(const text of array){

        const line =
            document.createElement("div");

        line.className="messageLine";

        container.appendChild(line);

        await typeText(
            text,
            line,
            72
        );

        await new Promise(
            resolve =>
                setTimeout(resolve,650)
        );
    }
}

    async function(){

        الأغنية الأولى تبدأ بسبب
        ضغطة المستخدم.
        */

        try{
            await song1.play();
        }catch(e){
            console.log(e);
        }

        introScreen.classList.add("hide");

        setTimeout(()=>{

            introScreen.classList.add(
                "hidden"
            );

            messageScreen.classList.remove(
                "hidden"
            );

            writeLines(
                firstLines,
                message
            );

        },1200);

    }
);


/* ==========================================
   بعد الأغنية الأولى
========================================== */

song1.addEventListener(
    "ended",
    function(){

        messageScreen.classList.add(
            "hide"
        );

        setTimeout(()=>{

            messageScreen.classList.add(
                "hidden"
            );

            finishScreen.classList.remove(
                "hidden"
            );

        },1200);

    }
);


/* ==========================================
   الأغنية الثانية
========================================== */

document
.getElementById("continueButton")
.addEventListener(
    "click",
    async function(){

        try{
            await song2.play();
        }catch(e){
            console.log(e);
        }

        finishScreen.classList.add(
            "hide"
        );

        setTimeout(()=>{

            finishScreen.classList.add(
                "hidden"
            );

            finalScreen.classList.remove(
                "hidden"
            );

            writeLines(
                finalLines,
                finalMessage
            );

        },1200);

    }
);

</script>
